name: Jayota staged import

on:
  push:
    branches:
      - chatgpt/jayota-import-20260911

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[imported]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply uploaded source update
        shell: bash
        run: |
          set -euo pipefail
          cat .update-payload/part-* > /tmp/jayota-update.tar.gz
          tar -xzf /tmp/jayota-update.tar.gz
          rm -rf .update-payload .github/workflows/jayota-import.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: App tests
        run: npm test

      - name: Script tests
        run: npm run test:scripts

      - name: Auth invariant
        run: npm run check:auth

      - name: Commit validated source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update Jayota from uploaded export [imported]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
