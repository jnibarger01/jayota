name: Jayota baseline validation

on:
  push:
    branches:
      - chatgpt/jayota-baseline-20260911

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Auth invariant
        run: npm run check:auth
      - name: Script tests
        run: npm run test:scripts
